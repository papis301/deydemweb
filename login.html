<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Connexion Administration - DEY DEM</title>
  <!-- Bootstrap 5 & Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
</head>
<body class="bg-dark d-flex align-items-center justify-content-center" style="height: 100vh;">

  <div class="card shadow-lg p-4" style="max-width: 400px; width: 100%;">
    <div class="card-body">
      <h3 class="card-title text-center mb-4 fw-bold">Espace Admin</h3>
      
      <div id="alertBox" class="alert alert-danger d-none" role="alert"></div>

      <form id="loginForm">
        <div class="mb-3">
          <label class="form-label fw-semibold">Nom d'utilisateur ou Email</label>
          <input type="text" id="username" class="form-control" required autofocus>
        </div>
        
        <!-- Champ Mot de Passe avec Bouton Afficher/Masquer -->
        <div class="mb-3">
          <label class="form-label fw-semibold">Mot de passe</label>
          <div class="input-group">
            <input type="password" id="password" class="form-control" required>
            <button class="btn btn-outline-secondary" type="button" id="togglePassword">
              <i class="bi bi-eye" id="toggleIcon"></i>
            </button>
          </div>
        </div>

        <button type="submit" class="btn btn-primary w-100 py-2 fw-bold">Se connecter</button>
      </form>
    </div>
  </div>

  <script>
    // Basculer l'affichage du mot de passe
    const togglePassword = document.getElementById('togglePassword');
    const passwordInput = document.getElementById('password');
    const toggleIcon = document.getElementById('toggleIcon');

    togglePassword.addEventListener('click', function () {
      const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
      passwordInput.setAttribute('type', type);
      
      // Changer l'icône de l'œil
      toggleIcon.classList.toggle('bi-eye');
      toggleIcon.classList.toggle('bi-eye-slash');
    });

    // Soumission du formulaire
    document.getElementById('loginForm').addEventListener('submit', async function(e) {
      e.preventDefault();
      
      const username = document.getElementById('username').value;
      const password = document.getElementById('password').value;
      const alertBox = document.getElementById('alertBox');

      try {
        const response = await fetch('api/admin_login.php', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password })
        });

        const data = await response.json();

        if (data.success) {
          window.location.href = 'admin.php';
        } else {
          alertBox.textContent = data.message;
          alertBox.classList.remove('d-none');
        }
      } catch (err) {
        alertBox.textContent = 'Erreur de connexion au serveur.';
        alertBox.classList.remove('d-none');
      }
    });
  </script>
</body>
</html>
